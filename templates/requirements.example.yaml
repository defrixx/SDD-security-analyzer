    annotation_sha256: f23bf6420577037b56426e716a33489e729f9b34f2e1f7290cb2c584dd60bdb9
    report_refs: []
limitations:
- Синтетический формат для обучения/round-trip. Не нормативный набор Hub. Пользователь
  должен задать собственную политику и область перед активацией.
