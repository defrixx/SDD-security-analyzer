name: spec-enricher-tests
services:
  tests:
    build:
      context: .
      target: runtime
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    volumes:
      - ./tests:/app/tests:ro
      - ./fixtures:/app/fixtures:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    mem_limit: 2g
    cpus: 2.0
    command: [python, -m, unittest, discover, -s, tests, -v]
